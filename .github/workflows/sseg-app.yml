# Gera o SSEG.exe (sseg/app/sseg_app.py) num Windows do GitHub e publica em Releases.
# Roda quando sseg/app/ muda no main. Para o programa avisar os analistas, subir sseg/app/VERSION
# junto com a VERSAO de sseg_app.py.
name: SSEG app (Windows)

on:
  push:
    branches: [main, "sseg-2.*"]  # sseg-2.0: prévia (prerelease), nunca oferecida como atualização
    paths: ["sseg/app/**", "sseg/ferramentas/**", ".github/workflows/sseg-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Instala de verdade num Windows limpo do GitHub (sem Poppler e sem Claude Code) e confere o
  # resultado como um PC novo veria. Não bloqueia o .exe: o resultado é lido nos passos.
  instalacao:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # A saída de cada passo vira anotação (::notice), que a API mostra sem login; o log não.
      - name: Antes (o que o PC já tem)
        continue-on-error: true
        shell: bash
        run: |
          python sseg/app/instalar.py --conferir > saida.txt 2>&1; rc=$?
          echo "::notice title=antes::$(tail -c 3000 saida.txt | tr -d '\r' | sed 's/%/%25/g' | tr '\n' '|')"
          exit $rc
      - name: Instalar o que falta
        continue-on-error: true
        shell: bash
        run: |
          python sseg/app/instalar.py --instalar > saida.txt 2>&1; rc=$?
          echo "::notice title=instalar::$(tail -c 3000 saida.txt | tr -d '\r' | sed 's/%/%25/g' | tr '\n' '|')"
          exit $rc
      - name: PATH do usuário tem Poppler e Claude Code
        shell: pwsh
        run: |
          $p = [Environment]::GetEnvironmentVariable('Path','User')
          Write-Output "::notice title=path-usuario::$($p -replace ';','%0A')"
          if ($p -notmatch 'Poppler') { exit 1 }
          if ($p -notmatch '\.local\\bin') { exit 1 }
          if ([Environment]::GetEnvironmentVariable('PYTHONUTF8','User') -ne '1') { exit 1 }
      - name: Git Bash usa o pdftotext do Poppler, não o do Git
        shell: bash
        run: |
          s=$(bash -ic 'which pdftotext pdftoppm python3; pdftotext -v' 2>&1)
          echo "::notice title=git-bash::$(echo "$s" | tr '\n' '|')"
          echo "$s" | grep -q Poppler
      # O terminal do passo herda o PATH do GitHub, não o do usuário: chamar pelo caminho.
      - name: Claude Code responde
        shell: bash
        run: |
          v=$("$USERPROFILE/.local/bin/claude.exe" --version 2>&1); echo "::notice title=claude::$v"
          echo "$v" | grep -q "Claude Code"

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir versão
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < sseg/app/VERSION)
          grep -q "VERSAO = \"$v\"" sseg/app/sseg_app.py || { echo "VERSION ($v) diferente da VERSAO do sseg_app.py"; exit 1; }
          echo "V=$v" >> "$GITHUB_ENV"
      - run: pip install "pyinstaller==6.*" "pywebview==5.*" pillow
      - run: pyinstaller --onefile --windowed --name SSEG --icon sseg/app/brasao.ico --add-data "sseg/app/brasao.png;." --add-data "sseg/app/brasao.ico;." --add-data "sseg/ferramentas/sol-entrar;sol-entrar" --add-data "sseg/app/web;web" --paths sseg/scripts --hidden-import analise_registro sseg/app/sseg_app.py
      - name: Abrir a janela e fotografar (prova de que monta no Windows)
        shell: bash
        run: |
          pip install pillow
          mkdir -p "$APPDATA/SSEG"
          python -c "import json,os; json.dump({'clone': os.getcwd(), 'processos': os.path.join(os.getcwd(), 'ppci-teste')}, open(os.path.join(os.environ['APPDATA'], 'SSEG', 'config.json'), 'w'))"
          SSEG_TESTE_FOTO=dist/previa.png timeout 120 python sseg/app/sseg_app.py --classico
          test -s dist/previa.png
          SSEG_TESTE_FOTO=dist/web.png timeout 180 python sseg/app/sseg_app.py || echo "::error title=web::a interface 2.0 não abriu ($?)"
          test -s dist/web.png
          echo "::notice title=telas::$(ls dist/previa*.png dist/web*.png | tr '\n' ' ')"
          if [ -s dist/previa-erros.txt ]; then echo "::error title=erro-em-tela::$(tr '\n' '|' < dist/previa-erros.txt | head -c 3000)"; exit 1; fi
          if [ -s dist/web-erros.txt ]; then echo "::error title=erro-em-tela-web::$(tr '\n' '|' < dist/web-erros.txt | head -c 3000)"; exit 1; fi
      - name: SOL Entrar (atalho na Área de Trabalho)
        shell: bash
        run: |
          r=$(cd sseg/app && PYTHONUTF8=1 python -c "import sol_entrar as s; print(s.instalar_atalho()); print(len(s.script_js())); print('|'.join(s.conferir()))" 2>&1) || { echo "::error title=sol-entrar::$(echo "$r" | tr -d '\r' | tr '\n' '|')"; exit 1; }
          echo "::notice title=sol-entrar::$(echo "$r" | tr -d '\r' | tr '\n' '|')"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.V }}${{ github.ref_name != 'main' && '-previa' || '' }}
          name: SSEG ${{ env.V }}${{ github.ref_name != 'main' && ' (prévia)' || '' }}
          prerelease: ${{ github.ref_name != 'main' }}
          body: Baixe o SSEG.exe abaixo. Na primeira vez o Windows pode avisar "Windows protegeu o computador" (programa sem assinatura) — Mais informações > Executar assim mesmo.
          files: |
            dist/SSEG.exe
            dist/previa*.png
            dist/web*.png
          make_latest: ${{ github.ref_name == 'main' }}
      # Uma cópia "antiga" (versão 0.0.1) numa pasta com espaço se atualiza para a que acabou de
      # sair: o arquivo tem de ficar igual ao publicado e o programa tem de reabrir.
      - name: Atualização automática do programa
        if: github.ref_name == 'main'  # baixa a última publicada: na prévia do ramo, não seria esta
        shell: pwsh
        run: |
          New-Item -ItemType Directory velho -Force | Out-Null
          (Get-Content sseg/app/sseg_app.py -Raw) -replace 'VERSAO = "[^"]*"','VERSAO = "0.0.1"' | Set-Content velho/sseg_app.py -Encoding utf8
          Get-ChildItem sseg/app/*.py | Where-Object { $_.Name -ne 'sseg_app.py' } | Copy-Item -Destination velho/
          pyinstaller --onefile --windowed --name SSEG --distpath dist-velho --workpath build-velho --add-data "sseg/app/brasao.png;." --add-data "sseg/app/brasao.ico;." --add-data "sseg/ferramentas/sol-entrar;sol-entrar" velho/sseg_app.py
          New-Item -ItemType Directory "C:\teste sseg" -Force | Out-Null
          Copy-Item dist-velho/SSEG.exe "C:\teste sseg\SSEG.exe"
          $antes = (Get-FileHash "C:\teste sseg\SSEG.exe").Hash
          # A marca prova que o .exe reaberto subiu de verdade: o processo da janela de erro
          # ("Failed to load Python DLL", 1.2.0) também contava como reaberto.
          $env:SSEG_TESTE_MARCA = "$env:RUNNER_TEMP\sseg-abriu.txt"
          Start-Process "C:\teste sseg\SSEG.exe" -ArgumentList "--atualizar"
          $publicado = (Get-FileHash dist/SSEG.exe).Hash
          for ($i = 0; $i -lt 90; $i++) { Start-Sleep 1; if ((Get-FileHash "C:\teste sseg\SSEG.exe" -ErrorAction SilentlyContinue).Hash -eq $publicado) { break } }
          # o .exe de arquivo único desempacota antes de abrir: espera a marca por até 60 s
          for ($k = 0; $k -lt 60; $k++) { Start-Sleep 1; if ((Get-Content $env:SSEG_TESTE_MARCA -ErrorAction SilentlyContinue) -contains $env:V) { break } }
          $depois = (Get-FileHash "C:\teste sseg\SSEG.exe").Hash
          $abriu = (Get-Content $env:SSEG_TESTE_MARCA -ErrorAction SilentlyContinue) -contains $env:V
          $reaberto = @(Get-Process SSEG -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "C:\teste sseg\SSEG.exe" }).Count
          Write-Output "::notice title=autoatualizacao::trocou=$($depois -eq $publicado) mudou=$($antes -ne $depois) reaberto=$reaberto abriu=$abriu segundos=$i espera=$k"
          Get-Process SSEG -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($depois -ne $publicado -or $reaberto -lt 1 -or -not $abriu) { exit 1 }
          exit 0
